
name: modrinth_publish

on:
  workflow_dispatch:

jobs:
  settup_build:
    uses: ./.github/workflows/shared_build.yml
  modrinth_publish:
    runs-on: ubuntu-latest
    steps:
    - name: Publish to Modrinth
      run: ./gradlew modrinth
      env:
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
